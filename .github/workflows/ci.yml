name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài pnpm
        uses: pnpm/action-setup@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Cài dependencies
        run: pnpm install --frozen-lockfile

      - name: Kiểm tra kiểu (typecheck)
        run: pnpm typecheck

      - name: Chạy test
        run: pnpm test

      - name: Build server
        run: pnpm --filter @chitieu/server build

      - name: Build web
        run: pnpm --filter @chitieu/web build
