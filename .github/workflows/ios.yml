name: Build iOS (.ipa)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cài pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Cài dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (webDir cho Capacitor)
        run: pnpm --filter @chitieu/web build

      - name: cap sync ios
        working-directory: apps/web
        run: pnpm exec cap sync ios

      - name: Tính số phiên bản từ tag git
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Phiên bản: ${VERSION} (build ${GITHUB_RUN_NUMBER})"

      - name: xcodebuild archive (chưa ký)
        working-directory: apps/web/ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            BUILD_TARGET=(-workspace App.xcworkspace)
          else
            BUILD_TARGET=(-project App.xcodeproj)
          fi
          echo "Dùng: ${BUILD_TARGET[*]}"

          # CODE_SIGN_STYLE=Manual (with signing off) avoids Xcode 14+ trying
          # to auto-resolve a signing identity for SPM plugin resource
          # bundles even when the app itself needs no signing at all.
          xcodebuild archive \
            "${BUILD_TARGET[@]}" \
            -scheme App \
            -configuration Release \
            -archivePath "$PWD/build/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Đóng gói ChiTieu-unsigned.ipa
        working-directory: apps/web/ios/App
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r -X ChiTieu-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/dist-ios"
          cp ChiTieu-unsigned.ipa "$GITHUB_WORKSPACE/dist-ios/"

      - name: Tải lên artifact (chưa ký)
        uses: actions/upload-artifact@v4
        with:
          name: ChiTieu-unsigned-ipa
          path: dist-ios/ChiTieu-unsigned.ipa
          if-no-files-found: error

      - name: Đính kèm vào GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-ios/ChiTieu-unsigned.ipa
          generate_release_notes: true

      # --- Ký (tùy chọn) ---------------------------------------------------
      # Chỉ chạy khi repo có đủ 4 secret sau. Không có thì bỏ qua toàn bộ,
      # không báo lỗi: IOS_P12_BASE64, IOS_P12_PASSWORD,
      # IOS_PROVISION_PROFILE_BASE64, APPLE_TEAM_ID.
      - name: Kiểm tra có secret ký hay không
        id: signing
        run: |
          if [[ -n "${{ secrets.IOS_P12_BASE64 }}" && -n "${{ secrets.IOS_P12_PASSWORD }}" && \
                -n "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" && -n "${{ secrets.APPLE_TEAM_ID }}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Thiếu secret ký — chỉ xuất bản chưa ký, đây là điều bình thường."
          fi

      - name: Tạo keychain tạm và cài chứng chỉ
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")"
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: xcodebuild archive (đã ký)
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/web/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -d "App.xcworkspace" ]; then
            BUILD_TARGET=(-workspace App.xcworkspace)
          else
            BUILD_TARGET=(-project App.xcodeproj)
          fi

          xcodebuild archive \
            "${BUILD_TARGET[@]}" \
            -scheme App \
            -configuration Release \
            -archivePath "$PWD/build/App-signed.xcarchive" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Xuất file .ipa đã ký
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/web/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'development' }}
        run: |
          cat > "$RUNNER_TEMP/export-options.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/App-signed.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export-options.plist"

          cp "$PWD/build/export/App.ipa" "$GITHUB_WORKSPACE/dist-ios/ChiTieu-signed.ipa"

      - name: Tải lên artifact (đã ký)
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ChiTieu-signed-ipa
          path: dist-ios/ChiTieu-signed.ipa
          if-no-files-found: error

      - name: Đính kèm bản đã ký vào GitHub Release
        if: steps.signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-ios/ChiTieu-signed.ipa

      - name: Đẩy lên TestFlight (nếu có đủ secret App Store Connect API)
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_KEY_P8_BASE64" ]]; then
            echo "Thiếu secret App Store Connect API — bỏ qua bước đẩy TestFlight."
            exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          xcrun altool --upload-app \
            -f "dist-ios/ChiTieu-signed.ipa" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
